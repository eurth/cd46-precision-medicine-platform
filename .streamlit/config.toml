[theme]
# Clinical Slate — must match theme.py (dark theme breaks dataframe/chart text on light surfaces)
base                     = "light"
primaryColor             = "#2563EB"
backgroundColor          = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#1E293B"
font                     = "sans serif"

[server]
headless             = true
enableCORS           = false
enableXsrfProtection = false
maxUploadSize        = 50

[browser]
gatherUsageStats = false
