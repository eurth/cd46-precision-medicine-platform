[theme]
# Clinical Slate — must match theme.py (dark theme breaks dataframe/chart text on light surfaces)
base                     = "light"
primaryColor             = "#2563EB"
backgroundColor          = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#1E293B"
font                     = "sans serif"
borderColor              = "#D5DEE8"
dataframeBorderColor     = "#D5DEE8"
dataframeHeaderBackgroundColor = "#EEF2F7"

[server]
headless             = true
enableCORS           = false
enableXsrfProtection = false
maxUploadSize        = 50

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit developer toolbar/menu — reduces chrome flash on deep-link refresh
toolbarMode = "minimal"
showSidebarNavigation = true
